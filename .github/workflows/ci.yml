name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    env:
      SFTP_HOST: 127.0.0.1
      SFTP_PORT: "2222"
      SFTP_USER: smoke
      SFTP_PASSWORD: smoke
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Start SFTP server
        run: docker run -d --name sftp -p 127.0.0.1:2222:22 atmoz/sftp "smoke:smoke:::upload"
      - run: bun run build
      - name: Wait for SFTP server
        run: timeout 30 bash -c 'until nc -z 127.0.0.1 2222; do sleep 1; done'
      - name: Smoke test
        run: node scripts/smoke-test.mjs node dist/index.js
